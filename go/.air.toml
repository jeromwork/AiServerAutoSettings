root = "."
tmp_dir = ".tmp"

[build]
cmd = "bash ./dev.sh --build"
bin = ".tmp/remoteagents"
full_bin = "bash ./dev.sh --run"
include_ext = ["go", "mod", "sum", "html", "css", "js", "json", "toml", "sh"]
exclude_dir = [".git", ".tmp", "dist", "tools/bench"]
exclude_regex = ["_test.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = false
